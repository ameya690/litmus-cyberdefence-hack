name: litmus
services:
  target:
    build: ./target_app
    environment:
      - DOCS_DIR=/app/docs
      - PORT=5000
    volumes:
      # Oracle plants the secret here (from the host); target reads it read-only.
      - ./challenge:/challenge:ro
    networks: [litmus-net]
    # No host port published on purpose: the target is reachable ONLY from inside
    # the Docker network -- via the attacker container or the capturing proxy.

  attacker:
    build: ./attacker
    depends_on: [target]
    networks: [litmus-net]
    # Network-only attacker sandbox used by the scripted baseline (prove.py).

  proxy:
    build: ./proxy
    environment:
      - TARGET_URL=http://target:5000
      - CAPTURE_FILE=/capture/wire.log
      - PORT=8080
    volumes:
      # Proxy tees the target's responses here; the oracle (host) reads this.
      - ./capture:/capture
    ports:
      - "127.0.0.1:8080:8080"   # the proxy is the ONLY channel exposed to the host
    depends_on: [target]
    networks: [litmus-net]

  clickhouse:
    image: clickhouse/clickhouse-server:24-alpine
    profiles: ["clickhouse"]   # opt-in: docker compose --profile clickhouse up -d
    ports:
      - "127.0.0.1:8123:8123"  # HTTP interface, reached by the harness + dashboard
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    networks: [litmus-net]

networks:
  litmus-net:
    driver: bridge
